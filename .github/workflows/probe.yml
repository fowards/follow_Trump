name: 수집 진단

# 데이터를 바꾸지 않고 탐색·다운로드·파싱·시세를 실제 네트워크에서 점검한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt

      - name: 1) 트럼프 PTR 자동 탐색
        run: |
          python3 - <<'PY'
          import sys, json; sys.path.insert(0,"scripts")
          import build_data as B
          cfg = B.load_sources("scripts/sources.json")
          urls = B.discover_ptr_urls(cfg)
          print(f"\n=== 트럼프 PTR {len(urls)}건 ===")
          for u in urls[:20]: print(" ", u)
          json.dump(urls, open("/tmp/urls.json","w"))
          PY

      - name: 2) 최신 PDF 텍스트 추출 진단
        if: always()
        run: |
          python3 - <<'PY'
          import sys, json; sys.path.insert(0,"scripts")
          import build_data as B
          try: urls = json.load(open("/tmp/urls.json"))
          except Exception: urls = []
          if not urls:
              urls = B.load_sources("scripts/sources.json")["ptrUrls"]
          u = urls[0]
          print("대상:", u)
          data = B.fetch_bytes(u)
          print("PDF 크기:", f"{len(data):,} bytes")
          from pypdf import PdfReader
          import io
          rd = PdfReader(io.BytesIO(data))
          print("페이지 수:", len(rd.pages))
          text = "\n".join((p.extract_text() or "") for p in rd.pages)
          print("추출 텍스트 길이:", len(text))
          print("\n===== 텍스트 앞 3000자 (원본 서식 확인용) =====")
          print(text[:3000])
          print("\n===== 현재 파서 결과 =====")
          rows = B.parse_ptr_text(text)
          print("원시 거래행:", len(rows))
          for r in rows[:10]: print("  ", r)
          PY

      - name: 3) Stooq 시세 진단
        if: always()
        run: |
          python3 - <<'PY'
          import urllib.request, sys
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36"}
          for url in ["https://stooq.com/q/d/l/?s=mrna.us&i=d",
                      "https://stooq.pl/q/d/l/?s=mrna.us&i=d"]:
              try:
                  req=urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=45) as r:
                      body=r.read().decode("utf-8","replace")
                  print(f"[{r.status}] {url}  {len(body)} bytes")
                  print("  앞부분:", body[:200].replace("\n"," | "))
              except Exception as e:
                  print(f"[FAIL] {url} → {type(e).__name__}: {e}")
          PY
