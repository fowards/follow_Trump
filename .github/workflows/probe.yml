name: OGE 탐색 진단

# 데이터를 바꾸지 않고 자동 탐색이 실제로 되는지만 확인한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt

      - name: OGE 뷰/문서 탐색 진단
        run: python3 scripts/build_data.py --probe-oge

      - name: 백업 URL 접근 가능 여부
        if: always()
        run: |
          python3 - <<'PY'
          import json, urllib.request
          UA={"User-Agent":"Mozilla/5.0 (compatible; follow-trump/1.0)"}
          urls=json.load(open("scripts/sources.json"))["ptrUrls"]
          for u in urls[:3]:
              try:
                  req=urllib.request.Request(u, headers=UA)
                  with urllib.request.urlopen(req, timeout=60) as r:
                      b=r.read()
                  print(f"OK  {len(b):>9,} bytes  {u.rsplit('/',1)[-1]}")
              except Exception as e:
                  print(f"FAIL  {e}  {u}")
          PY

      - name: 첫 PDF 실제 파싱 시험
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0,"scripts")
          import build_data as B
          u=json.load(open("scripts/sources.json"))["ptrUrls"][0]
          try:
              text=B.extract_pdf_text(B.fetch_bytes(u))
          except Exception as e:
              print("PDF 로드/추출 실패:",e); sys.exit(0)
          print("추출 텍스트 길이:",len(text))
          print("---- 앞 1500자 ----")
          print(text[:1500])
          rows=B.parse_ptr_text(text)
          print("---- 파싱 결과 ----")
          print("원시 거래행:",len(rows))
          for r in rows[:8]:
              print(" ",r)
          PY
