name: 수집 진단

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt

      - name: 시세 제공처 확인
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0,"scripts")
          import build_data as B
          for tk in ["MRNA","CMCSA","PTC"]:
              s = B.fetch_stooq_daily(tk)
              if s: print(f"  {tk}: {len(s)}일  최신 {s[-1][0]} ${s[-1][1]:.2f}")
          PY

      - name: 전체 PDF 파싱 → 개별 종목 추출
        if: always()
        run: |
          python3 - <<'PY'
          import sys, io; sys.path.insert(0,"scripts")
          import build_data as B
          from pypdf import PdfReader

          urls = B.discover_ptr_urls(B.load_sources("scripts/sources.json"))
          print(f"\n=== 트럼프 PTR {len(urls)}건 파싱 ===")
          tot_rows = tot_stock = 0
          stocks = []
          for u in urls:
              name = u.rsplit("/",1)[-1][-34:]
              try:
                  rd = PdfReader(io.BytesIO(B.fetch_bytes(u)))
                  text = "\n".join((p.extract_text() or "") for p in rd.pages)
                  rows = B.parse_ptr_text(text)
                  kept = []
                  for r in rows:
                      if B.is_individual_stock(r["asset"]) and B.extract_ticker(r["asset"]):
                          r["ticker"] = B.extract_ticker(r["asset"])
                          kept.append(r)
                  tot_rows += len(rows); tot_stock += len(kept)
                  stocks += kept
                  print(f"{name:<34} 공시 {str(rows[0]['disclosureDate']) if rows else '-':<10} "
                        f"거래 {len(rows):>4}  개별종목 {len(kept):>3}")
              except Exception as e:
                  print(f"{name:<34} 실패 {type(e).__name__}: {e}")

          print(f"\n총 거래행 {tot_rows} / 개별 종목 {tot_stock}")
          print("\n=== 추출된 개별 종목 (최대 40) ===")
          for r in stocks[:40]:
              print(f"  {r['ticker']:<6} {r['action']:<5} {r['transactionDate']} "
                    f"{r['amountRange']}  {r['asset'][:60]}")
          PY
